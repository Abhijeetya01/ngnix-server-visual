<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGINX Visual – a web server explained as a shop front desk</title>
<meta name="description" content="An animated, beginner-friendly diagram that explains the Nginx web server step by step.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Steps">
    <div class="brand">
      <h1>NGINX Visual</h1>
      <p>Abhijeet Ranjan's online shop needs a front desk manager. Follow the 9 steps.</p>
    </div>
    <nav id="steps" class="steps"></nav>
    <div class="controls">
      <button id="auto" type="button">Auto-play</button>
      <button id="reset" type="button">Reset</button>
    </div>
    <div class="legend">
      <h2>What the moving things mean</h2>
      <ul id="legend"></ul>
    </div>
  </aside>
  <main class="main">
    <div class="stage">
      <svg id="diagram" viewBox="0 0 1100 620" role="img" aria-label="Animated Nginx diagram"></svg>
    </div>
    <article class="caption" aria-live="polite">
      <h2 id="c-title"></h2>
      <div><h3>In plain words</h3><p id="c-plain"></p></div>
      <div><h3>Technical name</h3><p id="c-tech"></p></div>
      <div><h3>Watch the picture</h3><p id="c-watch"></p></div>
    </article>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
